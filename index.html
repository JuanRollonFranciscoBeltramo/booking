
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book your appointment online.">
    <title>Booking Website</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Booking Website</h1>
        <p>Book your next appointment online.</p>
    </header>

    <main>
        <section id="services">
            <h2>Our Services</h2>

            <div class="service-list">
                <article class="service">
                    <h3>Service One</h3>
                    <p>Description of the service.</p>
                    <p class="price">$10,000</p>
                    <button type="button" class="select-service"
                        data-service="Service One">
                        Select
                    </button>
                </article>

                <article class="service">
                    <h3>Service Two</h3>
                    <p>Description of the service.</p>
                    <p class="price">$15,000</p>
                    <button type="button" class="select-service"
                        data-service="Service Two">
                        Select
                    </button>
                </article>
            </div>
        </section>

        <section id="booking">
            <h2>Book an Appointment</h2>

            <form id="booking-form">
                <label for="selected-service">Selected service</label>
                <input id="selected-service" name="service"
                    type="text" placeholder="Choose a service above"
                    readonly required>

                <label for="booking-date">Date</label>
                <input id="booking-date" name="date"
                    type="date" required>

                <label for="booking-time">Time</label>
                <select id="booking-time" name="time" required>
                    <option value="">Choose a time</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                </select>

                <label for="customer-name">Full name</label>
                <input id="customer-name" name="name"
                    type="text" autocomplete="name" required>

                <label for="customer-phone">WhatsApp phone number</label>
<input id="customer-phone" name="phone"
    type="tel" autocomplete="tel"
    placeholder="+54 9 11 1234 5678" required>

                <button type="submit">Request Booking</button>
            </form>

            <p id="booking-message" role="status"
                aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Booking Website</p>
    </footer>

</body>
</html>
